name: Android CI

# - Push lên main / Pull request: build để kiểm tra code.
# - Push tag v* (vd: v1.0.2): build, ký bằng khóa cố định từ Secrets, kiểm tra
#   vân tay chứng chỉ, rồi tạo GitHub Release kèm file APK.

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

env:
  # Vân tay SHA-256 của khóa ký chính thức. Bản phát hành phải khớp giá trị này
  # thì mới cài đè được lên các bản trước.
  EXPECTED_CERT_SHA256: 4d915e75e54226f8325bf0ed3a2bd1ed2890aa94bc2f87bc3686a771cbf4221c

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore signing key
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Thiếu secret SIGNING_KEYSTORE_BASE64 — không thể phát hành bản ký chính thức."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "SIGNING_STORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug assembleRelease --stacktrace

      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - name: Verify signature
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)
          APK=app/build/outputs/apk/release/app-release.apk
          ACTUAL=$("$APKSIGNER" verify --print-certs "$APK" | grep 'Signer #1 certificate SHA-256' | awk '{print $NF}')
          echo "Vân tay chứng chỉ: $ACTUAL"
          if [ "$ACTUAL" != "$EXPECTED_CERT_SHA256" ]; then
            echo "::error::APK không được ký bằng khóa chính thức (mong đợi $EXPECTED_CERT_SHA256)."
            exit 1
          fi

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cp app/build/outputs/apk/release/app-release.apk "ChiTieu-$VERSION.apk"
          gh release create "$GITHUB_REF_NAME" "ChiTieu-$VERSION.apk" \
            --title "Chi Tiêu $GITHUB_REF_NAME" \
            --generate-notes
