name: Android CI

# Chỉ build để kiểm tra code biên dịch được.
# Bản APK phát hành được build và ký trên máy cá nhân bằng khóa cố định,
# rồi tải lên GitHub Releases (xem README > Phát hành phiên bản mới).

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug assembleRelease --stacktrace
